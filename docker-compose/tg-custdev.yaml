x-logging: &default-logging
    driver: "json-file"
    options:
        max-size: "10m"
        max-file: "3"

networks:
    net:
        name: net
        external: true

services:
    loom-custdev-tg-postgres:
        image: postgres:17.6
        container_name: "${LOOM_CUSTDEV_TG_POSTGRES_CONTAINER_NAME}"
        volumes:
            - "../${LOOM_CUSTDEV_TG_POSTGRES_VOLUME_DIR}:/var/lib/postgresql/data"
        ports:
            - "${LOOM_CUSTDEV_TG_POSTGRES_PORT}:5432"
        environment:
            POSTGRES_DB: "${LOOM_CUSTDEV_TG_POSTGRES_DB_NAME}"
            POSTGRES_USER: "${LOOM_CUSTDEV_TG_POSTGRES_USER}"
            POSTGRES_PASSWORD: "${LOOM_CUSTDEV_TG_POSTGRES_PASSWORD}"
            PGDATA: /var/lib/postgresql/data/pgdata
        logging: *default-logging
        restart: unless-stopped
        networks:
            - net

    loom-custdev-tg:
        build:
            context: "../../${LOOM_CUSTDEV_TG_CONTAINER_NAME}"
            dockerfile: "${LOOM_CUSTDEV_TG_DOCKERFILE_DIR}/Dockerfile"
        container_name: "${LOOM_CUSTDEV_TG_CONTAINER_NAME}"
        env_file:
            - "../env/.env.app"
            - "../env/.env.db"
            - "../env/.env.monitoring"
            - "../env/.env.runner"
        ports:
            - "${LOOM_CUSTDEV_TG_PORT}:${LOOM_CUSTDEV_TG_PORT}"
        restart: unless-stopped
        networks:
            - net